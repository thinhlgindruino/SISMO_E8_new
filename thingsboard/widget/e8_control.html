<div class="e8w">
  <div class="e8w-main">
    <img class="e8w-logo" alt="sismo fitness">
    <div class="e8w-name">-</div>
    <div class="e8w-time">--:--:--</div>
    <div class="e8w-sub"></div>
    <div class="e8w-dot e8w-online"></div>
    <div class="e8w-buttons">
      <button class="e8w-btn" data-cmd="play" title="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <button class="e8w-btn" data-cmd="pause" title="Pause"><svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg></button>
      <button class="e8w-btn" data-cmd="stop" title="Stop"><svg viewBox="0 0 24 24"><path d="M5.5 5.5h13v13h-13z"/></svg></button>
      <button class="e8w-btn" data-cmd="lock" title="Verrouiller"><svg viewBox="0 0 24 24"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v11h-13V10zm2.2 0h5.6V7.5a2.8 2.8 0 0 0-5.6 0z"/></svg></button>
      <button class="e8w-btn" data-cmd="unlock" title="Déverrouiller"><svg viewBox="0 0 24 24"><path d="M5.5 10h9.3V6.6a2.8 2.8 0 0 0-5.5-.7L7.2 5.3a5 5 0 0 1 9.8 1.3V10h1.5v11h-13z"/></svg></button>
      <button class="e8w-btn e8w-user" data-cmd="info" title="Informations"><svg viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 3.3a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8zm0 13.6a7.3 7.3 0 0 1-5.6-2.6c.6-1.9 3-3.2 5.6-3.2s5 1.3 5.6 3.2a7.3 7.3 0 0 1-5.6 2.6z"/></svg></button>
    </div>
    <div class="e8w-rows">
      <div class="e8w-row" data-key="access_mode"><span class="e8w-pill"></span><span class="e8w-dot"></span></div>
      <div class="e8w-row" data-key="motor_mode"><span class="e8w-pill"></span><span class="e8w-dot"></span></div>
      <div class="e8w-row" data-key="card_timer"><span class="e8w-pill"></span><span class="e8w-dot"></span></div>
      <div class="e8w-row" data-key="language"><span class="e8w-pill"></span><span class="e8w-dot"></span></div>
      <div class="e8w-row" data-key="motor_ratio"><span class="e8w-pill"></span><span class="e8w-dot"></span></div>
    </div>
    <button class="e8w-ok">OK</button>
    <div class="e8w-msg"></div>
  </div>
  <div class="e8w-panel">
    <div class="e8w-panel-head"><span>Informations</span><button class="e8w-close" title="Fermer">&times;</button></div>
    <label>Client</label><input class="e8w-in" data-attr="customer_name" maxlength="80">
    <label>Infos client</label><input class="e8w-in" data-attr="customer_info" maxlength="160">
    <label>Notes</label><textarea class="e8w-in" data-attr="customer_notes" rows="3" maxlength="1000"></textarea>
    <button class="e8w-save">Enregistrer</button>
    <table class="e8w-info"></table>
    <div class="e8w-fw">
      <label>Firmware</label>
      <div class="e8w-fw-line"><select class="e8w-fw-select"></select><button class="e8w-fw-go">Mettre à jour</button></div>
      <div class="e8w-fw-state"></div>
    </div>
    <div class="e8w-msg e8w-panel-msg"></div>
  </div>
</div>
